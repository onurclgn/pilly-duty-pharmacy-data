name: Günlük nöbetçi eczane snapshot'ı

on:
  schedule:
    - cron: "15 9 * * *"
      timezone: Europe/Istanbul
    - cron: "30 9 * * *"
      timezone: Europe/Istanbul
    - cron: "0 10 * * *"
      timezone: Europe/Istanbul
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: duty-pharmacy-daily-snapshot
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Güncel main dalını al
        run: git pull --rebase origin main
      - name: Resmî günlük veriyi doğrula ve yayınla
        run: python3 Scripts/update-duty-pharmacy-snapshot.py
      - name: Değişiklik varsa veri snapshot'ını kaydet
        run: |
          if git diff --quiet -- data; then
            echo "Bu hizmet günü için doğrulanmış snapshot zaten var."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: publish daily duty pharmacy snapshot"
          git push origin HEAD:main
